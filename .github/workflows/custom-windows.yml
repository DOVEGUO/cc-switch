name: Custom Windows MSI

on:
  workflow_dispatch:
  push:
    branches:
      - feat/commandcode
      - feat/kiro

permissions:
  contents: write

concurrency:
  group: custom-windows-msi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve upstream version
        id: version
        shell: pwsh
        run: |
          $package = Get-Content "package.json" -Raw | ConvertFrom-Json
          $version = [string]$package.version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Unable to resolve version from package.json"
          }

          $msiName = "CC-Switch-CommandCode-Kiro-v$version-x64.msi"
          $artifactName = "CC-Switch-CommandCode-Kiro-v$version-Windows-x64-MSI"
          $releaseTag = "v$version-commandcode-kiro"
          $releaseName = "CC Switch v$version - Command Code + Kiro"

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "msi_name=$msiName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact_name=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_name=$releaseName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Write-Host "Upstream version: $version"
          Write-Host "MSI: $msiName"
          Write-Host "Release tag: $releaseTag"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup pnpm
        shell: pwsh
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend type check
        run: pnpm typecheck

      - name: Frontend format check
        run: pnpm format:check

      - name: Frontend unit tests
        run: pnpm test:unit

      - name: Build frontend
        run: pnpm build:renderer

      - name: Normalize Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all

      - name: Command Code bridge tests
        working-directory: src-tauri
        env:
          CC_SWITCH_TEST_HOME: ${{ runner.temp }}/cc-switch-tests
        run: cargo test commandcode --lib

      - name: Kiro bridge tests
        working-directory: src-tauri
        env:
          CC_SWITCH_TEST_HOME: ${{ runner.temp }}/cc-switch-tests
        run: cargo test kiro --lib

      - name: Upload precompiled API route tests
        if: github.ref_name == 'feat/kiro'
        uses: actions/upload-artifact@v4
        with:
          name: Kiro-API-route-tests-windows-x64
          path: src-tauri/target/debug/deps/cc_switch_lib-*.exe
          if-no-files-found: error

      - name: Build Windows x64 MSI
        shell: pwsh
        run: |
          $override = Join-Path $env:RUNNER_TEMP "tauri-msi.json"
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Path $override -Encoding utf8
          pnpm tauri build --bundles msi --config $override

      - name: Stage MSI
        id: stage
        shell: pwsh
        env:
          MSI_NAME: ${{ steps.version.outputs.msi_name }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $msi = Get-ChildItem "src-tauri\target\release\bundle\msi\*.msi" | Select-Object -First 1
          if (-not $msi) {
            throw "MSI not found"
          }

          $dst = Join-Path "artifacts" $env:MSI_NAME
          Copy-Item $msi.FullName $dst

          $hash = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "path=$dst" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Write-Host "MSI: $dst"
          Write-Host "SHA256: $hash"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: artifacts/${{ steps.version.outputs.msi_name }}
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_NAME: ${{ steps.version.outputs.release_name }}
          VERSION: ${{ steps.version.outputs.version }}
          MSI_NAME: ${{ steps.version.outputs.msi_name }}
          MSI_SHA256: ${{ steps.stage.outputs.sha256 }}
        run: |
          $asset = Join-Path "artifacts" $env:MSI_NAME
          $notes = @"
          ## 功能

          - 支持 Command Code 与 Kiro API Key。
          - Kiro 区域配置及原生模型列表获取。
          - Anthropic 请求转换为 Kiro 协议，EventStream 响应转换为 Anthropic 格式。
          - 支持流式响应、工具调用及工具结果回传。
          - Kiro API Key 模式支持 Claude Code 内置 WebSearch；仅独立搜索请求走 Kiro MCP，工具表里同时含其他工具的请求不再被误拒。
          - Kiro 不返回逐请求 Token 数，其用量估算不再计入使用统计（估算值会虚增成本并压低缓存命中率）；本月 Kiro 额度仍在 Token Plan 查看。
          - Command Code 与 Kiro 的 Token Plan 配额查询（Kiro 显示本月 credits 已用/总量与重置时间）。
          - 访问 Kiro 时跟随 Windows 系统代理，无需在 Claude Code settings.json 中配置代理。

          ## 安装

          Windows x64 每用户 MSI，支持覆盖安装现有 CC Switch。

          SHA-256:
          $env:MSI_SHA256
          "@

          if (gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" 2>$null) {
            gh release upload $env:RELEASE_TAG $asset --clobber --repo "${{ github.repository }}"
            gh release edit $env:RELEASE_TAG --title $env:RELEASE_NAME --notes $notes --repo "${{ github.repository }}"
          } else {
            gh release create $env:RELEASE_TAG $asset --target "${{ github.sha }}" --title $env:RELEASE_NAME --notes $notes --repo "${{ github.repository }}"
          }
