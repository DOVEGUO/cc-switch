name: Custom Windows MSI

# 只在手动触发时运行。原先还监听 push 到 feat/commandcode，但每次 push 都会跑一次
# 完整的 Windows MSI 构建（15-25 分钟），是这个 fork 的 Actions 用量大头——GitHub
# 曾因此停掉本仓库的工作流。推送本身不需要出包，验证由下面这些步骤在发布时一并完成。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: custom-windows-msi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve upstream version
        id: version
        shell: pwsh
        run: |
          $package = Get-Content "package.json" -Raw | ConvertFrom-Json
          $version = [string]$package.version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Unable to resolve version from package.json"
          }

          $msiName = "CC-Switch-CommandCode-v$version-x64.msi"
          $artifactName = "CC-Switch-CommandCode-v$version-Windows-x64-MSI"
          $releaseTag = "v$version-commandcode"
          $releaseName = "CC Switch v$version - Command Code"

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "msi_name=$msiName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact_name=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_name=$releaseName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Write-Host "Upstream version: $version"
          Write-Host "MSI: $msiName"
          Write-Host "Release tag: $releaseTag"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup pnpm
        shell: pwsh
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend type check
        run: pnpm typecheck

      - name: Frontend format check
        run: pnpm format:check

      - name: Normalize Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all

      - name: Command Code bridge tests
        working-directory: src-tauri
        run: cargo test commandcode --lib

      - name: Build Windows x64 MSI
        shell: pwsh
        run: |
          $override = Join-Path $env:RUNNER_TEMP "tauri-msi.json"
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Path $override -Encoding utf8
          pnpm tauri build --bundles msi --config $override

      - name: Stage MSI
        id: stage
        shell: pwsh
        env:
          MSI_NAME: ${{ steps.version.outputs.msi_name }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $msi = Get-ChildItem "src-tauri\target\release\bundle\msi\*.msi" | Select-Object -First 1
          if (-not $msi) {
            throw "MSI not found"
          }

          $dst = Join-Path "artifacts" $env:MSI_NAME
          Copy-Item $msi.FullName $dst

          $hash = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "path=$dst" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Write-Host "MSI: $dst"
          Write-Host "SHA256: $hash"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: artifacts/${{ steps.version.outputs.msi_name }}
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_NAME: ${{ steps.version.outputs.release_name }}
          VERSION: ${{ steps.version.outputs.version }}
          MSI_NAME: ${{ steps.version.outputs.msi_name }}
          MSI_SHA256: ${{ steps.stage.outputs.sha256 }}
        run: |
          $asset = Join-Path "artifacts" $env:MSI_NAME
          $notes = @"
          基于官方 v$env:VERSION 定制的 CC Switch。

          ## 上游 v4.0.0 界面重构

          本次同步了上游 v4.0.0 / v4.0.1，界面换成侧边栏布局：应用切换，以及 MCP、
          Skills、提示词、会话、授权中心、用量统计等全局功能，都改从侧边栏进入。新增
          聚合模式，可以把多家供应商的模型并进同一个模型选择器；会话管理、应用页、
          额度显示与托盘菜单也一并重做。从 3.20.x 升上来会明显看出差别。

          ## 本发行版定制

          - Command Code 两个预设：Go 档（1 美元/月，无 API 接入，由本地路由模拟官方
            CLI 打 /alpha/generate）与 API 档（上游预设，走 /provider/v1）
          - 两档的额度卡都可用：Go 档的裸域名与 API 档的 /provider 共用根域名下的
            /alpha/* 控制面，5 小时 / 每周 / 每月三档都取上游返回的实时值，不写死上限
          - 额度与 token 用量沿用官方采集器记账，没有另建统计
          - 界面收敛到 Claude Code / Claude Desktop / Codex 三个应用；被隐藏应用的
            后端代码照旧编译，已写入的配置照常保留、照常同步
          - 「添加供应商」隐藏黄星赞助预设
          - 仅发布 Windows x64 MSI；保持官方安装身份与 UpgradeCode，可直接覆盖安装

          安装：下载下面的 MSI 运行即可覆盖现有安装。

          SHA-256:
          $env:MSI_SHA256
          "@

          if (gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" 2>$null) {
            gh release upload $env:RELEASE_TAG $asset --clobber --repo "${{ github.repository }}"
            gh release edit $env:RELEASE_TAG --title $env:RELEASE_NAME --notes $notes --repo "${{ github.repository }}"
          } else {
            gh release create $env:RELEASE_TAG $asset --target "${{ github.sha }}" --title $env:RELEASE_NAME --notes $notes --repo "${{ github.repository }}"
          }
